<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noorvera Financial | Know exactly where your business stands.</title>
  <meta name="description" content="We clean up messy books, correct your P&L and balance sheet, and give you financials you can trust.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
  <style>
    :root{--deep:#0F2A22;--mid:#15332A;--cream:#E7D9B0;--paper:#EFE8D2;--gold:#C9A24B;--ink:#173C30;--mute:#A8B5A5;--rule:#2F5143;--red:#B4432F}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--deep);color:var(--cream);line-height:1.6;overflow-x:hidden}
    h1,h2,h3{font-family:'Young Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
    a{color:inherit}
    :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    .w{max-width:1120px;margin:0 auto;padding:0 28px}
    section{padding:112px 0}
    header{position:fixed;inset:0 0 auto;z-index:9;background:rgba(15,42,34,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
    header .w{display:flex;align-items:center;justify-content:space-between;height:68px}
    .br{display:flex;align-items:center;gap:12px;font-family:'Young Serif',serif;font-size:20px;text-decoration:none}
    .br img{width:36px;height:36px;border-radius:5px}
    nav{display:flex;align-items:center;gap:28px;font-size:15px}
    nav a{color:var(--mute);text-decoration:none}
    nav a:hover{color:var(--cream)}
    .btn{display:inline-block;background:var(--gold);color:var(--deep);padding:14px 28px;font:700 15px 'Hanken Grotesk',sans-serif;text-decoration:none;border:0;cursor:pointer;transition:background .2s}
    .btn:hover{background:var(--cream)}
    nav .btn{padding:10px 20px;color:var(--deep)}
    .ghost{background:none;color:var(--cream);border:1.5px solid var(--rule)}
    .ghost:hover{background:none;border-color:var(--gold)}
    #hero{position:relative;padding:150px 0 100px;background:radial-gradient(560px circle at var(--x,72%) var(--y,35%),rgba(201,162,75,.2),transparent 62%),linear-gradient(135deg,#0F2A22,#1B4436)}
    #hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 83px,rgba(62,92,78,.3) 83px 84px);pointer-events:none}
    .hg{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
    h1{font-size:clamp(44px,6.6vw,88px);line-height:1.02;margin-bottom:26px}
    .lede{font-size:18px;color:#D3CCAE;max-width:46ch;margin-bottom:34px}
    .cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:30px}
    .tools{font-size:14px;color:var(--mute);max-width:46ch}
    .led{background:var(--paper);color:var(--ink);padding:24px 26px 20px;border:1px solid var(--gold);transform:rotate(-1.4deg)}
    .led h3{font-size:19px;margin-bottom:12px}
    .r{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid #d6cdb0;font-size:14.5px;font-variant-numeric:tabular-nums;transition:opacity .5s}
    .r b{font-weight:500;text-align:right}
    .chip{font-style:normal;font-size:12px;padding:1px 8px;margin-left:6px;border:1px solid currentColor}
    .bad{color:var(--red)}
    .ok{color:#2F7A52;display:none}
    .fl{color:var(--red);font-size:12px;margin-left:6px}
    .add{max-height:0;opacity:0;padding:0 0;overflow:hidden;border-bottom:0;transition:max-height .6s,opacity .6s,padding .6s}
    .clean .dup{opacity:.35;text-decoration:line-through}
    .clean .fl,.clean .chip.bad{display:none}
    .clean .chip.ok{display:inline-block}
    .clean .add{max-height:52px;opacity:1;padding:11px 0;border-bottom:1px solid #d6cdb0}
    .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px}
    .tot span{font-size:14px}
    .tot strong{font:400 40px 'Young Serif',serif;color:var(--red);transition:color .6s}
    .clean .tot strong{color:#2F7A52}
    .led button{margin-top:14px;background:var(--ink);color:var(--paper);border:0;padding:11px 18px;font:700 14px 'Hanken Grotesk',sans-serif;cursor:pointer}
    .led button:hover{background:#0F2A22}
    #fix{background:var(--deep)}
    h2{font-size:clamp(34px,4.6vw,56px);line-height:1.08;margin-bottom:22px;max-width:18ch}
    .intro{font-size:18px;color:#D3CCAE;max-width:56ch;margin-bottom:56px}
    .fx{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;padding:32px 0;border-top:1px solid var(--rule);transition:padding .3s,border-color .3s}
    .fx:last-child{border-bottom:1px solid var(--rule)}
    .fx h3{font-size:clamp(26px,3.6vw,40px);line-height:1.15;transition:color .3s}
    .fx p{color:var(--mute);align-self:center;max-width:44ch}
    .fx:hover{padding-left:16px;border-top-color:var(--gold)}
    .fx:hover h3{color:var(--gold)}
    #how{background:var(--mid)}
    .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:44px;margin-top:48px}
    .n{font:400 120px/1 'Young Serif',serif;color:transparent;-webkit-text-stroke:1.5px var(--gold);margin-bottom:10px}
    .sg h3{font-size:24px;margin-bottom:10px}
    .sg p{color:var(--mute);max-width:34ch}
    .cg{display:grid;grid-template-columns:1fr 1fr;gap:64px}
    .mail{display:inline-block;margin-top:20px;font:400 24px 'Young Serif',serif;text-decoration:none;border-bottom:1.5px solid var(--gold);padding-bottom:3px;word-break:break-all}
    .mail:hover{color:var(--gold)}
    form{display:flex;flex-direction:column;gap:22px}
    label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
    input,textarea{width:100%;background:none;border:0;border-bottom:1.5px solid var(--rule);color:var(--cream);font:16px 'Hanken Grotesk',sans-serif;padding:8px 0;outline:0}
    input:focus,textarea:focus{border-bottom-color:var(--gold)}
    textarea{resize:vertical;min-height:84px}
    form .btn{align-self:flex-start}
    footer{padding:30px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--mute)}
    @media(max-width:860px){
      section{padding:76px 0}
      .hg,.fx,.cg,.sg{grid-template-columns:1fr}
      .fx{gap:10px}.cg{gap:44px}
      nav a:not(.btn){display:none}
      .led{transform:none}
      #hero{padding-top:120px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
